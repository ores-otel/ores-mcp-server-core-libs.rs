[package]
name = "ores-telemetry"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Hardened OpenTelemetry runtime boundary for ORES Rust applications"
license = "MIT"
repository = "https://github.com/ores-otel/ores-mcp-server-core-libs.rs"
readme = "README.md"
keywords = ["observability", "opentelemetry", "telemetry", "tracing"]
categories = ["development-tools::debugging"]

[dependencies]
opentelemetry = { version = "=0.32.0", default-features = false, features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = { version = "=0.32.0", default-features = false }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["grpc-tonic", "logs", "metrics", "tls-ring", "tls-webpki-roots", "trace"] }
opentelemetry_sdk = { version = "=0.32.0", default-features = false, features = ["logs", "metrics", "trace"] }
tracing = "0.1"
tracing-opentelemetry = "=0.33.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
url = "2.5"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
