# Cloud and SaaS connectors for ores-otel/ores-mcp-server-core-libs.rs.
#
# A connector is declared by the ENVIRONMENT VARIABLE NAMES its SDK reads, not
# by any credential or account value. Define the env and the connector is live.
# Secrets never appear in this file.
#
# Non-secret identifiers (org slugs, domain, Slack channel, Linear project)
# come from ores-otel's infra-isolation contract where recorded; an empty value
# means "not recorded on disk", not "unavailable" — the env vars still drive it.
schema_version = 1
github_org = "ores-otel"

[connectors.aws]
enabled = true
sdk = "aws-sdk-rust"
env = ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN", "AWS_REGION", "AWS_ROLE_ARN", "AWS_ENDPOINT_URL"]

[connectors.gcp]
enabled = true
sdk = "google-cloud-rust"
env = ["GOOGLE_APPLICATION_CREDENTIALS", "GOOGLE_CLOUD_PROJECT"]
project = ""

[connectors.neon]
enabled = true
env = ["NEON_API_KEY", "NEON_DATABASE_URL"]
org = ""

[connectors.cloudflare]
enabled = true
env = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "CLOUDFLARE_ZONE_ID"]
domain = ""

[connectors.supabase]
enabled = true
env = ["SUPABASE_URL", "SUPABASE_PROJECT_REF", "SUPABASE_PUBLISHABLE_KEY", "SUPABASE_SERVICE_ROLE_KEY"]
org = ""

[connectors.linear]
enabled = true
env = ["LINEAR_API_KEY", "LINEAR_TEAM_KEY"]
project = ""

[connectors.slack]
enabled = true
env = ["SLACK_BOT_TOKEN", "SLACK_SIGNING_SECRET", "SLACK_APP_TOKEN"]
channel = ""

[connectors.make]
enabled = true
# No MAKE_* convention existed in the fleet; these names are introduced here.
env = ["MAKE_API_TOKEN", "MAKE_TEAM_ID", "MAKE_WEBHOOK_URL"]

[connectors.google_apps_script]
enabled = true
# No APPS_SCRIPT_* convention existed in the fleet; introduced here.
env = ["GOOGLE_APPS_SCRIPT_ID", "GOOGLE_APPS_SCRIPT_DEPLOYMENT_ID", "GOOGLE_APPLICATION_CREDENTIALS"]

[connectors.google_chat]
enabled = true
env = ["GOOGLE_CHAT_SPACE_ID", "GOOGLE_CHAT_IMPERSONATE_EMAIL", "GOOGLE_APPLICATION_CREDENTIALS"]

[connectors.github]
enabled = true
env = ["GITHUB_TOKEN"]
org = "ores-otel"
