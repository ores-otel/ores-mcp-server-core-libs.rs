# Managed by .ores-lint/ - regenerated by the rollout script.
name: ores-lint

on:
  pull_request:
  workflow_dispatch:
  # Add `push:` here once this repo's lint debt is paid down.

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect project types
        id: detect
        run: |
          [ -f package.json ] && echo "js=true" >> "$GITHUB_OUTPUT" || echo "js=false" >> "$GITHUB_OUTPUT"
          [ -f Cargo.toml ]   && echo "rs=true" >> "$GITHUB_OUTPUT" || echo "rs=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.detect.outputs.js == 'true'
        with:
          node-version: '22'

      - name: Install JS dependencies
        if: steps.detect.outputs.js == 'true'
        run: npm ci

      - name: Install clippy
        if: steps.detect.outputs.rs == 'true'
        run: rustup component add clippy

      - name: Run ores-lint
        run: sh .ores-lint/lint.sh
        env:
          # Warn-only. Set to 1 here to make lint findings fail this repo's CI.
          ORES_LINT_STRICT: '0'
