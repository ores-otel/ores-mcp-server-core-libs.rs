name: RMCP audited lock one-shot promotion

on:
  push:
    branches:
      - fix/DEN-1950-rmcp-3-2-audited-lock
    paths:
      - .github/workflows/rmcp-lock-promote-once.yml

permissions:
  contents: write

concurrency:
  group: rmcp-lock-promote-once
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'ores-otel/ores-mcp-server-core-libs.rs' && github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact promotion commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
          show-progress: false

      - name: Verify immutable promotion parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'd220ed8b6f5e99bf68b479fc5c9daa71938971a9'

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt

      - name: Regenerate the reviewed RMCP and ChaCha lock
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.88.0 update -p rmcp --precise 3.2.0
          cargo +1.88.0 update -p chacha20 --precise 0.10.2

      - name: Require byte-for-byte audited lock candidate
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'aa151774da9248ba97b1ab0632a75448469fe20fedcf626bb518cb6d0dc4ee2d' 'Cargo.lock' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('Cargo.lock').read_text(encoding='utf-8')
          packages = {}
          for block in text.split('[[package]]')[1:]:
              name = re.search(r'^name = "([^"]+)"$', block, re.MULTILINE)
              version = re.search(r'^version = "([^"]+)"$', block, re.MULTILINE)
              if name and version:
                  packages.setdefault(name.group(1), set()).add(version.group(1))

          assert packages.get('rmcp') == {'3.2.0'}, packages.get('rmcp')
          assert 'rmcp-macros' not in packages, packages.get('rmcp-macros')
          assert packages.get('chacha20') == {'0.10.2'}, packages.get('chacha20')
          assert '0.10.1' not in packages.get('chacha20', set())
          PY
          cargo +1.88.0 metadata --locked --format-version 1 --no-deps >/dev/null
          cargo +1.88.0 tree --locked -p rmcp@3.2.0 -e normal >/tmp/rmcp-tree.txt
          cargo +1.88.0 tree --locked -i chacha20@0.10.2 -e normal >/tmp/chacha20-reverse-tree.txt
          git diff --exit-code -- Cargo.toml
          test "$(git diff --name-only | sort)" = 'Cargo.lock'

      - name: Check formatting
        run: cargo +1.88.0 fmt --all --check

      - name: Lint exact refreshed closure
        run: cargo +1.88.0 clippy --all-targets --all-features --locked -- -D warnings

      - name: Test exact refreshed closure
        run: cargo +1.88.0 test --all-features --locked

      - name: Install pinned RustSec scanner
        run: cargo +1.88.0 install cargo-audit --version 0.22.2 --locked

      - name: Audit exact refreshed lock
        run: cargo +1.88.0 audit --deny warnings

      - name: Commit only the audited Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort)" = 'Cargo.lock'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock
          git diff --cached --quiet && { echo 'Expected a Cargo.lock promotion diff.' >&2; exit 1; }
          git commit -m 'chore(DEN-1950): promote audited RMCP 3.2 lock'

      - name: Push validated lock to exact PR branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git --hostname github.com
          git push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
