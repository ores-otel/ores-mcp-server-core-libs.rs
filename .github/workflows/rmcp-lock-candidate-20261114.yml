name: Temporary audited RMCP lockfile candidate

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/rmcp-lock-candidate-20261114.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.88.0'
      - name: Refresh lockfile under the supported MSRV
        run: cargo +1.88.0 update
      - name: Check resolver integrity
        run: cargo +1.88.0 metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Emit resolved lockfile for committed review
        shell: bash
        run: |
          printf '%s\n' 'HHM_LOCKFILE_BEGIN'
          base64 Cargo.lock
          printf '%s\n' 'HHM_LOCKFILE_END'
