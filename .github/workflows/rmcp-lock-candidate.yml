name: RMCP audited lock candidate

on:
  pull_request:
    branches: [dev]
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/rmcp-lock-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rmcp-lock-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt

      - name: Generate RMCP and ChaCha lock candidates
        run: |
          set -euo pipefail
          cargo +1.88.0 update -p rmcp --precise 3.2.0
          cargo +1.88.0 update -p chacha20 --precise 0.10.2

      - name: Verify the exact dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("Cargo.lock").read_text(encoding="utf-8")
          packages = {}
          for block in text.split("[[package]]")[1:]:
              name = re.search(r'^name = "([^"]+)"$', block, re.MULTILINE)
              version = re.search(r'^version = "([^"]+)"$', block, re.MULTILINE)
              if name and version:
                  packages.setdefault(name.group(1), set()).add(version.group(1))

          assert packages.get("rmcp") == {"3.2.0"}, packages.get("rmcp")
          assert "rmcp-macros" not in packages, packages.get("rmcp-macros")
          assert packages.get("chacha20") == {"0.10.2"}, packages.get("chacha20")
          assert "0.10.1" not in packages.get("chacha20", set())
          PY
          cargo +1.88.0 metadata --locked --format-version 1 --no-deps >/dev/null
          cargo +1.88.0 tree --locked -p rmcp@3.2.0 -e normal > "${RUNNER_TEMP}/rmcp-tree.txt"
          cargo +1.88.0 tree --locked -i chacha20@0.10.2 -e normal > "${RUNNER_TEMP}/chacha20-reverse-tree.txt"

      - name: Preserve the reviewed manifest
        run: git diff --exit-code -- Cargo.toml

      - name: Check formatting
        run: cargo +1.88.0 fmt --all --check

      - name: Lint the refreshed closure
        run: cargo +1.88.0 clippy --all-targets --all-features --locked -- -D warnings

      - name: Test the refreshed closure
        run: cargo +1.88.0 test --all-features --locked

      - name: Install pinned RustSec scanner
        run: cargo +1.88.0 install cargo-audit --version 0.22.2 --locked

      - name: Audit the refreshed lock
        run: cargo +1.88.0 audit --deny warnings | tee "${RUNNER_TEMP}/cargo-audit.txt"

      - name: Retain exact candidate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: rmcp-lock-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            Cargo.lock
            ${{ runner.temp }}/rmcp-tree.txt
            ${{ runner.temp }}/chacha20-reverse-tree.txt
            ${{ runner.temp }}/cargo-audit.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  promote-audited-lock:
    name: Promote byte-identical audited lock
    needs: candidate
    if: github.event_name == 'pull_request' && github.repository == 'ores-otel/ores-mcp-server-core-libs.rs' && github.actor == 'ORESoftware' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/DEN-1950-rmcp-3-2-audited-lock'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tested PR head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Recreate and fingerprint the audited lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.88.0 update -p rmcp --precise 3.2.0
          cargo +1.88.0 update -p chacha20 --precise 0.10.2
          printf '%s  %s\n' 'aa151774da9248ba97b1ab0632a75448469fe20fedcf626bb518cb6d0dc4ee2d' 'Cargo.lock' | sha256sum -c -
          git diff --exit-code -- Cargo.toml
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo 'needs_push=false' >> "$GITHUB_OUTPUT"
          else
            test "${#changed[@]}" -eq 1
            test "${changed[0]}" = 'Cargo.lock'
            echo 'needs_push=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit only the byte-identical audited lock
        if: steps.lock.outputs.needs_push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock
          git commit -m 'chore(DEN-1950): promote audited RMCP 3.2 lock'

      - name: Push validated lock to exact PR branch
        if: steps.lock.outputs.needs_push == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"
