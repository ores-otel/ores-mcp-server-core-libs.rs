name: Temporary MSRV lockfile repair

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/rmcp-msrv-lock.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.88.0'
      - name: Resolve dependencies compatible with the declared MSRV
        run: |
          cargo +1.88.0 update -p generator --precise 0.8.9
          cargo +1.88.0 update -p uuid --precise 1.24.1
          cargo +1.88.0 metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Emit Cargo-approved lockfile
        run: |
          printf '%s\n' 'HHM_LOCKFILE_BEGIN'
          base64 Cargo.lock
          printf '%s\n' 'HHM_LOCKFILE_END'
