name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo +1.88.0 fmt --all --check
      - name: Lint
        run: cargo +1.88.0 clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo +1.88.0 test --all-features --locked
      - name: Install pinned RustSec scanner
        run: cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo +1.88.0 audit --deny warnings

  lifecycle-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download and verify TLA+ tools 1.7.4
        run: |
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            -o /tmp/tla2tools-1.7.4.jar
          printf '%s  %s\n' \
            '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88' \
            /tmp/tla2tools-1.7.4.jar | sha256sum -c -
      - name: Check lifecycle model
        run: >-
          java -XX:+UseParallelGC -jar /tmp/tla2tools-1.7.4.jar
          -config formal/McpLifecycle.cfg formal/McpLifecycle.tla
