[workspace]
members = [".", "crates/ores-telemetry"]
resolver = "2"

[package]
name = "ores-mcp-server-core-libs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Secure shared runtime components for ORES Rust MCP servers"
license = "MIT"
repository = "https://github.com/ores-otel/ores-mcp-server-core-libs.rs"
readme = "README.md"
keywords = ["mcp", "observability", "opentelemetry", "ai"]
categories = ["development-tools", "web-programming"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
futures = "0.3"
ores-telemetry = { version = "0.1.0", path = "crates/ores-telemetry" }
reqwest = { version = "=0.12.23", default-features = false, features = ["rustls-tls-webpki-roots"] }
rmcp = { version = "=3.1.4", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "=1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"

[dev-dependencies]
loom = "=0.7.2"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
