version = 1
mode = "server"
strict = true

[flags2env]
contract = ".cli-flags.toml"
require_audit = true
precedence = "argv-over-env"

[sync]
push_interval_ms = 5000
pull_interval_ms = 5000
max_batch_size = 64
conflict_policy = "manual"

[[env]]
name = "audit_capacity"
key = "OPTO_SYNC_MCP_AUDIT_CAPACITY"
kind = "integer"
required = false
secret = false
default = "128"

[server]
enabled = true
